<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="meta.title.quiz">Test de Personnalité - Le Manoir</title>
    <meta name="description" content="Quel mangeur es-tu au Manoir ? 5 questions pour découvrir ton profil et les plats qui vont avec.">
    <meta name="theme-color" content="#1A1A1A">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="../shared/hub.css?v=4">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body data-game="quiz">

    <nav class="hub-nav" aria-label="Navigation des jeux">
        <div class="hub-nav-inner">
            <a class="hub-back" href="../index.html" aria-label="Retour au menu principal">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                <span data-i18n="hub.back">Retour au Menu</span>
            </a>
            <div class="hub-links">
                <a class="hub-link" href="../combo-ideal/" data-game="combo"><span class="hl-full"><span aria-hidden="true">🎰 </span><span data-i18n="hub.combo">Combo Idéal</span></span><span class="hl-short"><span aria-hidden="true">🎰 </span><span data-i18n="hub.combo.short">Combo</span></span></a>
                <a class="hub-link" href="../who-pays/" data-game="who"><span class="hl-full"><span aria-hidden="true">👥 </span><span data-i18n="hub.who">Qui Paye ?</span></span><span class="hl-short"><span aria-hidden="true">👥 </span><span data-i18n="hub.who.short">Qui Paye</span></span></a>
                <a class="hub-link" href="../quiz/" data-game="quiz"><span class="hl-full"><span aria-hidden="true">🧠 </span><span data-i18n="hub.quiz">Test de Personnalité</span></span><span class="hl-short"><span aria-hidden="true">🧠 </span><span data-i18n="hub.quiz.short">Test</span></span></a>
            </div>
            <button class="hub-dark-toggle" aria-label="Toggle dark mode" data-i18n-title="aria.dark"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <main class="quiz-main">
        <!-- Écran 1 : introduction -->
        <section class="qz-screen" id="qz-intro">
            <div class="rm-header">
                <span class="section-icon"><i class="fas fa-brain"></i></span>
                <h1 data-i18n="quiz.title">Test de Personnalité</h1>
                <div class="section-divider"></div>
                <p class="rm-tagline" data-i18n="quiz.tagline">5 questions. Ton profil au Manoir… et les plats qui vont avec.</p>
            </div>
            <div class="rm-actions">
                <button type="button" class="spin-btn" id="qz-start"><i class="fas fa-play"></i><span data-i18n="quiz.start">Commencer le test</span></button>
            </div>
        </section>

        <!-- Écran 2 : questions -->
        <section class="qz-screen hidden" id="qz-question">
            <div class="qz-progress">
                <span class="qz-progress-label" id="qz-progress-label">Question 1/5</span>
                <div class="qz-bar"><div class="qz-bar-inner" id="qz-bar"></div></div>
            </div>
            <h2 class="qz-question-text" id="qz-text"></h2>
            <div class="qz-options" id="qz-options"></div>
        </section>

        <!-- Écran 3 : résultat -->
        <section class="qz-screen hidden" id="qz-result">
            <div class="qz-result-card">
                <span class="qz-result-emoji" id="qz-emoji" aria-hidden="true"></span>
                <h2 id="qz-profile-name"></h2>
                <p class="qz-tagline" id="qz-tagline"></p>
                <h3 class="qz-rec-title" data-i18n="quiz.rec.title">Ta sélection au Manoir</h3>
                <div class="qz-recs" id="qz-recs"></div>
                <div class="qz-actions">
                    <button type="button" class="spin-btn" id="qz-share" data-i18n="story.share"><i class="fas fa-camera"></i> Partager en Story</button>
                    <button type="button" class="result-btn ghost" id="qz-restart" data-i18n="quiz.restart"><i class="fas fa-rotate-left"></i> Recommencer le test</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="page-footer">
        <a href="../index.html" data-i18n="footer.view-full-menu">Voir le menu complet de <strong>Le Manoir</strong> <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../shared/i18n.js?v=4"></script>
    <script src="../shared/menu-data.js?v=4"></script>
    <script src="../shared/hub.js?v=4"></script>
    <script src="../shared/story.js?v=4"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
