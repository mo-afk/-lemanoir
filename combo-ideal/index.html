<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title data-i18n="meta.title.combo">Combo Idéal - Le Manoir</title>
    <meta name="description" content="Le générateur de combo idéal de Le Manoir : un plat + une boisson qui va avec, choisis pour toi.">
    <meta name="theme-color" content="#1A1A1A">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="../shared/hub.css?v=4">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body data-game="combo">

    <nav class="hub-nav" aria-label="Navigation des jeux" data-i18n-title="aria.hub.nav">
        <div class="hub-nav-inner">
            <a class="hub-back" href="../index.html" aria-label="Retour au menu principal" data-i18n-title="aria.hub.back">
                <i class="fas fa-home hub-back-home" aria-hidden="true"></i>
                <i class="fas fa-arrow-left hub-back-arrow" aria-hidden="true"></i>
                <span class="hub-back-text" data-i18n="hub.back">Retour au Menu</span>
            </a>
            <div class="hub-links">
                <a class="hub-link" href="../combo-ideal/" data-game="combo"><span class="hl-full"><span aria-hidden="true">🎰 </span><span data-i18n="hub.combo">Combo Idéal</span></span><span class="hl-short"><span aria-hidden="true">🎰 </span><span data-i18n="hub.combo.short">Combo</span></span></a>
                <a class="hub-link" href="../who-pays/" data-game="who"><span class="hl-full"><span aria-hidden="true">👥 </span><span data-i18n="hub.who">Qui Paye ?</span></span><span class="hl-short"><span aria-hidden="true">👥 </span><span data-i18n="hub.who.short">Qui Paye</span></span></a>
                <a class="hub-link" href="../quiz/" data-game="quiz"><span class="hl-full"><span aria-hidden="true">🧠 </span><span data-i18n="hub.quiz">Test de Personnalité</span></span><span class="hl-short"><span aria-hidden="true">🧠 </span><span data-i18n="hub.quiz.short">Quiz</span></span></a>
            </div>
            <button class="hub-dark-toggle" aria-label="Toggle dark mode" data-i18n-title="aria.dark"><i class="fas fa-moon"></i></button>
        </div>
    </nav>

    <main class="combo-main">
        <div class="rm-header">
            <span class="section-icon"><i class="fas fa-wand-magic-sparkles"></i></span>
            <h1 data-i18n="combo.title">Combo Idéal</h1>
            <div class="section-divider"></div>
            <p class="rm-tagline" data-i18n="combo.tagline">Un plat + une boisson qui va avec, choisis pour toi.</p>
        </div>

        <div class="rm-body">
            <div class="roulette-periods" role="group" aria-label="Choisir le service" data-i18n-title="combo.aria.periods">
                <button type="button" class="period-chip" data-period="breakfast">
                    <i class="fas fa-mug-hot"></i><span class="period-name" data-i18n="combo.period.breakfast.name">Petit Déj</span><span class="period-time" data-i18n="combo.period.breakfast.time">07h — 11h</span>
                </button>
                <button type="button" class="period-chip" data-period="lunch">
                    <i class="fas fa-utensils"></i><span class="period-name" data-i18n="combo.period.lunch.name">Déjeuner</span><span class="period-time" data-i18n="combo.period.lunch.time">12h — 16h</span>
                </button>
                <button type="button" class="period-chip" data-period="dinner">
                    <i class="fas fa-moon"></i><span class="period-name" data-i18n="combo.period.dinner.name">Dîner</span><span class="period-time" data-i18n="combo.period.dinner.time">19h — 00h</span>
                </button>
            </div>

            <div class="wheel-shell show" id="wheel-shell">
                <div class="wheel-pointer" aria-hidden="true"></div>
                <div class="wheel-frame">
                    <canvas id="wheel-canvas" aria-hidden="true"></canvas>
                    <button type="button" class="wheel-hub" id="wheel-hub" aria-label="Proposer un combo" data-i18n-title="combo.aria.hub">
                        <span class="wheel-hub-label" data-i18n="combo.hub.label">SPIN</span>
                        <span class="wheel-hub-sub" data-i18n="combo.hub.sub">Combo</span>
                    </button>
                </div>
            </div>

            <div class="rm-actions">
                <button type="button" class="spin-btn" id="spin-btn"><i class="fas fa-arrows-rotate"></i><span data-i18n="combo.spin">Spin / Proposer</span></button>
            </div>
            <p class="roulette-hint" id="roulette-hint"></p>

            <div class="rm-result" aria-live="polite">
                <div class="result-reel" id="result-reel">
                    <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
                    <p id="result-reel-text" data-i18n="combo.reel">Choisis ton service puis lance la roue</p>
                </div>

                <article class="combo-card" id="combo-card">
                    <div class="combo-media" id="combo-media">
                        <video id="combo-video" muted loop playsinline preload="none"></video>
                        <div class="combo-media-fallback">
                            <i class="fas fa-utensils" aria-hidden="true"></i>
                            <span id="combo-media-label"></span>
                        </div>
                    </div>
                    <div class="combo-body">
                        <p class="combo-kicker" id="combo-kicker" data-i18n="combo.kicker">Ton combo idéal</p>
                        <div class="combo-line">
                            <span class="combo-name" id="combo-dish"></span>
                            <span class="combo-price" id="combo-dish-price"></span>
                        </div>
                        <div class="combo-plus" aria-hidden="true">+</div>
                        <div class="combo-line drink">
                            <span class="combo-name" id="combo-drink"></span>
                            <span class="combo-price" id="combo-drink-price"></span>
                        </div>
                        <div class="combo-total"><span data-i18n="combo.total">Total</span><strong id="combo-total"></strong></div>
                        <div class="combo-actions">
                            <button type="button" class="result-btn" id="act-share" data-i18n="story.share"><i class="fas fa-camera"></i> Partager en Story</button>
                            <button type="button" class="result-btn ghost" id="act-respin" data-i18n="combo.respin"><i class="fas fa-arrows-rotate"></i> Re-spin</button>
                            <button type="button" class="result-btn ghost" id="act-locate" data-i18n="combo.locate"><i class="fas fa-location-arrow"></i> Voir dans le menu</button>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <a href="../index.html" data-i18n="footer.view-full-menu">Voir le menu complet de <strong>Le Manoir</strong> <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../shared/i18n.js?v=4"></script>
    <script src="../shared/menu-data.js?v=4"></script>
    <script src="../shared/hub.js?v=4"></script>
    <script src="../shared/story.js?v=4"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
